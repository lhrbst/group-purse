spring:
  application:
    name: group-purse
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grouppurse}
    username: ${DB_USER:grouppurse}
    password: ${DB_PASSWORD:grouppurse}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    # Fehlerantworten als ProblemDetail mit Text ("detail"), damit die Oberfläche die Meldung des Servers anzeigen kann
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:disabled}
    retry:
      max-attempts: ${SPRING_AI_RETRY_MAX_ATTEMPTS:3}

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:true}
  forward-headers-strategy: framework

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        gk.receipt.ai.duration: true
        gk.receipt.end_to_end: true
      minimum-expected-value:
        gk.receipt.ai.duration: 1s
        gk.receipt.end_to_end: 5s
      maximum-expected-value:
        gk.receipt.ai.duration: 300s
        gk.receipt.end_to_end: 3600s
    tags:
      application: gruppenkasse

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  storage:
    dir: ${STORAGE_DIR:./data/receipts}
  receipt:
    enabled: ${RECEIPT_AI_ENABLED:false}
    model: ${RECEIPT_MODEL:gpt-6-luna}
    fallback-model: ${RECEIPT_FALLBACK_MODEL:gpt-6.1-sol}
    # Belege werden im Hintergrund gelesen, deshalb darf ein einzelner KI-Aufruf lange dauern
    timeout-seconds: ${RECEIPT_TIMEOUT_SECONDS:180}
    # Wartezeit vor dem nächsten Versuch: n-ter Versuch wartet n x diesen Wert
    retry-backoff-seconds: ${RECEIPT_RETRY_BACKOFF_SECONDS:120}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${OPENAPI_ENABLED:false}
