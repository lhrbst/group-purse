spring:
  application:
    name: group-purse
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grouppurse}
    username: ${DB_USER:grouppurse}
    password: ${DB_PASSWORD:grouppurse}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:disabled}

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:true}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  storage:
    dir: ${STORAGE_DIR:./data/receipts}
  receipt:
    enabled: ${RECEIPT_AI_ENABLED:false}
    model: ${RECEIPT_MODEL:gpt-6-luna}
    fallback-model: ${RECEIPT_FALLBACK_MODEL:gpt-6.1-sol}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${OPENAPI_ENABLED:false}
