global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8081']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # Caddy-Metriken (Admin-Endpunkt, nur im Docker-Netz); lokal gibt es keinen Caddy, das Ziel ist dort einfach down
  - job_name: caddy
    static_configs:
      - targets: ['caddy:2019']

  # Erreichbarkeit und Zertifikat über die öffentliche Adresse
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [https_2xx]
    file_sd_configs:
      - files: ['/tmp/targets/*.yml']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
