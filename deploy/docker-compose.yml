name: gruppenkasse

include:
  - path: monitoring/docker-compose.monitoring.yml

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:?GRAFANA_DOMAIN fehlt (Subdomain für Grafana, z. B. grafana.kasse.deinverein.de)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # Zertifikate: muss erhalten bleiben (Let's-Encrypt-Rate-Limits)
      - caddy_config:/config
    depends_on:
      - app
    mem_limit: 100m

  app:
    image: ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/grouppurse
      DB_USER: grouppurse
      DB_PASSWORD: ${DB_PASSWORD}
      APP_BASE_URL: https://${DOMAIN}
      COOKIE_SECURE: "true"
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash   # JSON-Logs für Loki
      STORAGE_DIR: /data/receipts
      OPENAI_API_KEY: ${OPENAI_API_KEY:-disabled}
      RECEIPT_AI_ENABLED: ${RECEIPT_AI_ENABLED:-false}
      RECEIPT_MODEL: ${RECEIPT_MODEL:-gpt-6-luna}
      RECEIPT_FALLBACK_MODEL: ${RECEIPT_FALLBACK_MODEL:-gpt-6.1-sol}
    volumes:
      - receipts:/data/receipts
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    mem_limit: 700m

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: grouppurse
      POSTGRES_USER: grouppurse
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grouppurse -d grouppurse"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 300m

volumes:
  caddy_data:
  caddy_config:
  receipts:
  pgdata:
