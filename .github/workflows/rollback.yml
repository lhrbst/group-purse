name: Rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image-Tag (Git-Hash der Version, zu der zurückgekehrt werden soll)'
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USER: ${{ github.actor }}
    steps:
      - name: Tag prüfen
        run: |
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "Ungültiger Tag"; exit 1; }
      - name: SSH vorbereiten
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Auf den gewählten Tag zurücksetzen
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin" <<< "$GHCR_TOKEN"
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "/opt/gruppenkasse/deploy.sh '$IMAGE_TAG'"
