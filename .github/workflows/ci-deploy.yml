name: CI und Deploy

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend-Tests (Testcontainers gegen echtes Postgres)
        run: ./mvnw -B -ntp verify
      - name: Frontend-Tests und Build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

  monitoring-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compose-Dateien prüfen (lokal und Produktion, jeweils mit Monitoring)
        run: |
          docker compose --profile monitoring config -q
          docker compose --env-file deploy/env.example -f deploy/docker-compose.yml config -q
      - name: Prometheus-Konfiguration und Alarmregeln prüfen und testen
        run: |
          docker run --rm -v "$PWD/deploy/monitoring/prometheus:/p" --entrypoint promtool prom/prometheus:v3.5.0 check config /p/prometheus.yml
          docker run --rm -v "$PWD/deploy/monitoring/prometheus:/p" --entrypoint promtool prom/prometheus:v3.5.0 test rules /p/tests/gruppenkasse.test.yml
      - name: Dashboards prüfen (gültig und vom Generator erzeugt)
        run: python3 deploy/monitoring/tools/check_dashboards.py

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Image-Name bestimmen (GHCR verlangt Kleinschreibung)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image bauen; auf main mit Git-Hash als Tag in die Registry pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deployment ist vorerst abgeschaltet (noch keine VM). Zum Aktivieren die Zeile
  # "if: false" durch die auskommentierte Bedingung ersetzen und die SSH-/App-Secrets setzen.
  deploy:
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Pflicht-Secrets prüfen (sonst würde secrets.env auf dem Server leer überschrieben)
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GRAFANA_DOMAIN: ${{ secrets.GRAFANA_DOMAIN }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          missing=()
          for name in SSH_HOST SSH_USER SSH_KEY DOMAIN DB_PASSWORD GRAFANA_DOMAIN GRAFANA_ADMIN_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Fehlende GitHub-Secrets: ${missing[*]} (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Image-Name bestimmen (GHCR verlangt Kleinschreibung)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: SSH vorbereiten
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Geheimnisse als secrets.env schreiben
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RECEIPT_AI_ENABLED: ${{ secrets.RECEIPT_AI_ENABLED }}
          RECEIPT_MODEL: ${{ secrets.RECEIPT_MODEL }}
          RECEIPT_FALLBACK_MODEL: ${{ secrets.RECEIPT_FALLBACK_MODEL }}
          GRAFANA_DOMAIN: ${{ secrets.GRAFANA_DOMAIN }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          umask 077
          q() { printf "%s='%s'\n" "$1" "${2//\'/\'\\\'\'}"; }
          {
            q GITHUB_REPOSITORY "${GITHUB_REPOSITORY,,}"
            for name in DOMAIN DB_PASSWORD OPENAI_API_KEY RECEIPT_AI_ENABLED RECEIPT_MODEL RECEIPT_FALLBACK_MODEL GRAFANA_DOMAIN GRAFANA_ADMIN_PASSWORD; do
              q "$name" "${!name}"
            done
          } > secrets.env

      - name: Konfiguration auf den Server kopieren
        run: |
          SSH="ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST"
          scp -i ~/.ssh/deploy_key deploy/docker-compose.yml deploy/Caddyfile deploy/postgres.conf deploy/deploy.sh "$SSH_USER@$SSH_HOST:/opt/gruppenkasse/"
          scp -r -i ~/.ssh/deploy_key deploy/monitoring "$SSH_USER@$SSH_HOST:/opt/gruppenkasse/"
          scp -i ~/.ssh/deploy_key secrets.env "$SSH_USER@$SSH_HOST:/opt/gruppenkasse/secrets.env"
          $SSH 'chmod 600 /opt/gruppenkasse/secrets.env && chmod 755 /opt/gruppenkasse/deploy.sh'

      - name: Deployen (mit automatischem Rollback bei fehlgeschlagenem Health-Check)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin" <<< "$GHCR_TOKEN"
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "/opt/gruppenkasse/deploy.sh '${{ github.sha }}'"

      - name: Von außen prüfen (DNS, Caddy, Zertifikat, App)
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://${DOMAIN}/actuator/health" | grep -q '"status":"UP"'; then
              echo "https://${DOMAIN} ist erreichbar und gesund."
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://${DOMAIN}/actuator/health antwortet nicht (DNS, Caddy-Zertifikat oder Firewall prüfen: docker compose logs caddy)"
          exit 1
